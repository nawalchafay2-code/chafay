<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cabinet RH | Recrutement & Académie</title><style>
:root{--navy:#12243d;--blue:#2368d9;--bg:#f3f6fb;--muted:#617086;--line:#dfe6f0;--green:#137c63}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#1b2a40}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:white}button:hover{filter:brightness(.94)}button.ghost{background:#e8eef8;color:#254568}button.danger{background:#b72f40}button.small{padding:6px 9px;font-size:12px}header{background:var(--navy);color:white;padding:23px max(24px,calc((100vw - 1300px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}header h1{margin:0;font-size:23px}header p{margin:3px 0;color:#bdd0e7}header .badge{background:#243f63;padding:8px 12px;border-radius:20px}nav{background:white;box-shadow:0 1px 7px #14253d14;display:flex;flex-wrap:wrap;gap:6px;padding:12px max(24px,calc((100vw - 1300px)/2))}nav button{background:transparent;color:#405470}nav button.active{background:#e7f0ff;color:#1757bf}main{max-width:1300px;margin:24px auto;padding:0 20px 60px}h2{margin:0 0 6px;font-size:24px}h3{margin:0 0 13px;font-size:17px}.sub{color:var(--muted);margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 5px 20px #17314e08}.metric b{font-size:32px;color:#1d5dca;display:block}.metric span{color:var(--muted)}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:16px}input,select,textarea{border:1px solid #cbd7e7;background:white;border-radius:9px;padding:10px;min-width:0}input[type=search]{min-width:240px}label{display:grid;gap:5px;font-weight:600;color:#3b4e67}label input,label select,label textarea{font-weight:400}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}.wide{grid-column:1/-1}table{width:100%;border-collapse:collapse}th,td{padding:11px 9px;border-bottom:1px solid #e8edf4;text-align:left;vertical-align:top}th{font-size:12px;color:#617086;text-transform:uppercase}td{overflow-wrap:anywhere}.scroll{overflow-x:auto}.pill{display:inline-block;padding:3px 9px;background:#e7f0ff;border-radius:30px;color:#25549c;font-size:12px}.note{background:#fff6e5;border:1px solid #f1dfb4;padding:13px;border-radius:10px;margin-bottom:16px}.ok{background:#e9f8f1;border:1px solid #bfe7d4;padding:12px;border-radius:9px}.muted{color:var(--muted)}.hide{display:none!important}.course{border:1px solid var(--line);border-radius:12px;padding:17px;margin-bottom:12px}.course strong{font-size:16px}.progress{height:8px;background:#e5eaf2;border-radius:12px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green)}.actions{display:flex;flex-wrap:wrap;gap:6px}.empty{text-align:center;padding:30px;color:var(--muted)}footer{max-width:1300px;margin:auto;padding:0 20px 35px;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.formgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid,.formgrid{grid-template-columns:1fr}header{display:block}header .badge{display:inline-block;margin-top:10px}nav{padding:8px}nav button{padding:8px}main{padding:0 12px}th,td{font-size:12px;padding:8px 5px}}
</style></head><body><header><div><h1>Cabinet RH <span style="color:#83b4ff">/ Académie</span></h1><p>Recrutement • Gestion des talents • Formation en ligne</p></div><span class="badge">Version indépendante V2 · locale</span></header><nav id="nav"></nav><main id="app"></main><footer>Prototype autonome : les données restent dans ce navigateur. Ne pas utiliser pour des CV réels sans hébergement sécurisé, accès contrôlés et conformité à la protection des données.</footer><script>
'use strict';
const KEY='cabinet-rh-independent-v2';const sections=[['dashboard','Vue d’ensemble'],['candidates','CVthèque'],['jobs','Offres & missions'],['pipeline','Suivi recrutements'],['matching','Matching'],['academy','Académie RH'],['data','Sauvegarde']];
const initial=()=>({candidates:[],jobs:[],applications:[],courses:[{id:'cours-r1',title:'Fondamentaux du recrutement',category:'Recrutement',duration:4,description:'Analyse du besoin, sourcing, entretien structuré et intégration.',lessons:[{title:'Définir le besoin',text:'Formaliser les missions, compétences indispensables et critères mesurables.'},{title:'Conduire un entretien',text:'Utiliser des questions identiques et des grilles d’évaluation factuelles.'}],quiz:{q:'Quel outil aide à comparer équitablement les candidatures ?',options:['Une grille de critères liés au poste','L’intuition seule','L’âge du candidat'],answer:0}},{id:'cours-r2',title:'Ingénierie de la formation RH',category:'Formation',duration:6,description:'Analyse des besoins, objectifs pédagogiques et évaluation des acquis.',lessons:[{title:'Analyser les besoins',text:'Relier les besoins en compétences aux objectifs organisationnels.'},{title:'Évaluer la formation',text:'Mesurer satisfaction, apprentissages et transfert en situation de travail.'}],quiz:{q:'Quel est le premier point d’un plan de formation ?',options:['Choisir un logo','Identifier les besoins','Imprimer les attestations'],answer:1}},{id:'cours-r3',title:'Intégration et suivi des collaborateurs',category:'Intégration',duration:3,description:'Préparer l’accueil, les objectifs et les entretiens de suivi.',lessons:[{title:'Construire un parcours',text:'Prévoir un accueil, un référent, des objectifs à 30, 60 et 90 jours.'}],quiz:{q:'Que comprend un parcours d’intégration efficace ?',options:['Un accueil structuré et un suivi','Aucun échange','Une simple signature'],answer:0}}],progress:{},meta:{created:new Date().toISOString()}});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial();if(!Array.isArray(db.candidates)||!Array.isArray(db.jobs)||!Array.isArray(db.applications))throw Error('format');db.courses ||= initial().courses;db.progress ||= {}}catch(e){db=initial();alert('Sauvegarde locale illisible : une session vide a été ouverte. Aucune donnée n’a été supprimée.')}let current='dashboard';const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);const norm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();const words=x=>new Set(norm(x).split(/[^a-z0-9+#]+/).filter(w=>w.length>=3));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Stockage local saturé : exportez une sauvegarde JSON.');return false}};const msg=t=>{let e=$('#feedback');if(e){e.textContent=t;e.classList.remove('hide');setTimeout(()=>e?.classList.add('hide'),4500)}};const dl=(name,content,type)=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function shell(){ $('#nav').innerHTML=sections.map(([k,v])=>`<button data-nav="${k}" class="${current===k?'active':''}">${v}</button>`).join('');$('#app').innerHTML='<div id="feedback" class="ok hide" role="status"></div><div id="view"></div>'};function go(k){current=k;shell();render()};document.addEventListener('click',e=>{let b=e.target.closest('[data-nav]');if(b)go(b.dataset.nav)});
const head=(title,sub)=>`<h2>${title}</h2><p class="sub">${sub}</p>`;const empty=t=>`<div class="empty">${t}</div>`;const options=(arr,value)=>arr.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('');
function render(){let v=$('#view');if(current==='dashboard'){let p=db.applications;v.innerHTML=head('Tableau de bord','Suivez les recrutements et l’activité de formation.')+`<div class="grid"><div class="card metric"><span>Candidats</span><b>${db.candidates.length}</b></div><div class="card metric"><span>Offres ouvertes</span><b>${db.jobs.filter(x=>x.status==='Ouverte').length}</b></div><div class="card metric"><span>Candidatures suivies</span><b>${p.length}</b></div><div class="card metric"><span>Parcours RH</span><b>${db.courses.length}</b></div></div><div class="two"><div class="card"><h3>Pipeline de recrutement</h3>${['Nouveau','Présélectionné','Entretien','Shortlist','Retenu','Refusé'].map(s=>`<p><span class="pill">${s}</span> <b>${p.filter(x=>x.status===s).length}</b></p>`).join('')}</div><div class="card"><h3>Démarrage rapide</h3><p>1. Ajoutez un candidat ou importez un CSV.</p><p>2. Créez une offre et ses compétences attendues.</p><p>3. Utilisez le matching, puis suivez les candidatures.</p><p>4. Consultez les formations et validez les quiz.</p></div></div><div class="note"><b>Confidentialité :</b> cette version ne comporte ni serveur, ni connexion Gmail, ni authentification. Les CV PDF/DOCX ne sont pas analysés automatiquement. N’importez pas de données personnelles réelles sur un ordinateur partagé.</div>`;return}
if(current==='candidates'){v.innerHTML=head('CVthèque','Ajoutez, recherchez et classez les profils par domaine.')+`<div class="card"><h3>Nouveau candidat</h3><form id="candidateForm"><div class="formgrid"><label>Nom complet *<input name="name" required maxlength="120"></label><label>Email<input type="email" name="email" maxlength="150"></label><label>Téléphone<input name="phone" maxlength="50"></label><label>Ville<input name="city" maxlength="80"></label><label>Domaine professionnel<input name="domain" placeholder="Ex. Finance, RH, IT" maxlength="100"></label><label>Années d’expérience<input name="years" type="number" min="0" max="60" step="0.5"></label><label class="wide">Compétences (séparées par des virgules)<input name="skills" maxlength="1000"></label><label class="wide">Notes professionnelles<textarea name="notes" rows="2" maxlength="3000"></textarea></label></div><button>Ajouter le candidat</button></form></div><div class="card"><div class="toolbar"><input id="cq" type="search" placeholder="Nom, compétences, ville…"><select id="cd"><option value="">Tous les domaines</option></select><button class="ghost" id="exportCandidates">Exporter CSV</button></div><div class="scroll"><table><thead><tr><th>Nom</th><th>Domaine</th><th>Ville</th><th>Compétences</th><th>Exp.</th><th>Action</th></tr></thead><tbody id="candidateRows"></tbody></table></div></div>`;$('#candidateForm').onsubmit=ev=>{ev.preventDefault();let x=Object.fromEntries(new FormData(ev.target));let key=norm(x.email);if(key&&db.candidates.some(c=>norm(c.email)===key)){msg('Doublon probable : cette adresse e-mail existe déjà.');return}db.candidates.push({...x,id:uid(),years:Number(x.years)||0,created:new Date().toISOString()});save();render();msg('Candidat ajouté.')};$('#cq').oninput=rows;$('#cd').onchange=rows;$('#exportCandidates').onclick=exportCandidates;$('#cd').innerHTML='<option value="">Tous les domaines</option>'+[...new Set(db.candidates.map(c=>c.domain).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join('');rows();return}
if(current==='jobs'){v.innerHTML=head('Offres & missions','Définissez les besoins de vos entreprises clientes.')+`<div class="card"><h3>Nouvelle offre</h3><form id="jobForm"><div class="formgrid"><label>Intitulé du poste *<input name="title" required maxlength="150"></label><label>Entreprise *<input name="company" required maxlength="150"></label><label>Ville<input name="city" maxlength="80"></label><label>Domaine<input name="domain" maxlength="100"></label><label>Expérience minimale (années)<input name="minYears" type="number" min="0" max="60" value="0"></label><label>Statut<select name="status"><option>Ouverte</option><option>Suspendue</option><option>Clôturée</option></select></label><label class="wide">Compétences recherchées *<input name="skills" required maxlength="1000" placeholder="Ex. paie, CNSS, recrutement"></label><label class="wide">Description<textarea name="description" rows="2" maxlength="3000"></textarea></label></div><button>Créer l’offre</button></form></div><div class="card scroll"><h3>Offres enregistrées</h3><table><thead><tr><th>Poste</th><th>Entreprise</th><th>Ville</th><th>Compétences</th><th>Statut</th><th>Action</th></tr></thead><tbody>${db.jobs.map(j=>`<tr><td>${esc(j.title)}</td><td>${esc(j.company)}</td><td>${esc(j.city)}</td><td>${esc(j.skills)}</td><td><select data-jobstatus="${j.id}">${options(['Ouverte','Suspendue','Clôturée'],j.status)}</select></td><td><button class="small danger" data-deljob="${j.id}">Supprimer</button></td></tr>`).join('')||'<tr><td colspan="6">Aucune offre enregistrée.</td></tr>'}</tbody></table></div>`;$('#jobForm').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));db.jobs.push({...x,id:uid(),minYears:Number(x.minYears)||0});save();render();msg('Offre créée.')};v.querySelectorAll('[data-jobstatus]').forEach(x=>x.onchange=()=>{db.jobs.find(j=>j.id===x.dataset.jobstatus).status=x.value;save()});v.querySelectorAll('[data-deljob]').forEach(x=>x.onclick=()=>{if(!confirm('Supprimer cette offre et ses candidatures associées ?'))return;db.jobs=db.jobs.filter(j=>j.id!==x.dataset.deljob);db.applications=db.applications.filter(a=>a.jobId!==x.dataset.deljob);save();render()});return}
if(current==='pipeline'){v.innerHTML=head('Suivi des recrutements','Associez un candidat à une offre et suivez chaque étape.')+`<div class="card"><h3>Nouvelle candidature</h3><form id="applicationForm" class="toolbar"><select name="candidateId" required><option value="">Sélectionner un candidat</option>${db.candidates.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><select name="jobId" required><option value="">Sélectionner une offre</option>${db.jobs.map(j=>`<option value="${j.id}">${esc(j.title)} — ${esc(j.company)}</option>`).join('')}</select><button>Associer</button></form></div><div class="card scroll"><h3>Pipeline</h3><table><thead><tr><th>Candidat</th><th>Offre</th><th>Étape</th><th>Note</th><th>Action</th></tr></thead><tbody>${db.applications.map(a=>{let c=db.candidates.find(x=>x.id===a.candidateId),j=db.jobs.find(x=>x.id===a.jobId);return `<tr><td>${esc(c?.name||'Profil supprimé')}</td><td>${esc(j?.title||'Offre supprimée')}</td><td><select data-stage="${a.id}">${options(['Nouveau','Présélectionné','Entretien','Shortlist','Retenu','Refusé'],a.status)}</select></td><td><input data-appnote="${a.id}" value="${esc(a.note||'')}" maxlength="500" placeholder="Compte rendu factuel"></td><td><button class="small danger" data-delapp="${a.id}">Retirer</button></td></tr>`}).join('')||'<tr><td colspan="5">Aucune candidature suivie.</td></tr>'}</tbody></table></div>`;$('#applicationForm').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(db.applications.some(a=>a.candidateId===x.candidateId&&a.jobId===x.jobId)){msg('Cette candidature existe déjà.');return}db.applications.push({...x,id:uid(),status:'Nouveau',note:''});save();render()};v.querySelectorAll('[data-stage]').forEach(x=>x.onchange=()=>{db.applications.find(a=>a.id===x.dataset.stage).status=x.value;save()});v.querySelectorAll('[data-appnote]').forEach(x=>x.onchange=()=>{db.applications.find(a=>a.id===x.dataset.appnote).note=x.value;save()});v.querySelectorAll('[data-delapp]').forEach(x=>x.onclick=()=>{db.applications=db.applications.filter(a=>a.id!==x.dataset.delapp);save();render()});return}
if(current==='matching'){v.innerHTML=head('Matching candidats / offres','Classement indicatif et explicable, fondé sur les compétences et l’expérience renseignées.')+`<div class="card"><div class="toolbar"><label>Offre à analyser<select id="matchJob"><option value="">Choisir une offre</option>${db.jobs.filter(j=>j.status==='Ouverte').map(j=>`<option value="${j.id}">${esc(j.title)} — ${esc(j.company)}</option>`).join('')}</select></label></div><div class="note">Le score est une aide au tri, pas une décision automatisée. Il ne prend pas en compte l’âge, le genre ou d’autres caractéristiques sensibles. Les données non renseignées réduisent la pertinence du résultat.</div><div id="matches"></div></div>`;$('#matchJob').onchange=matchRows;return}
if(current==='academy'){v.innerHTML=head('Académie RH','Parcours pédagogiques de démonstration avec leçons et quiz.')+`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr))">${db.courses.map(c=>{let p=db.progress[c.id]||{};return `<div class="card"><span class="pill">${esc(c.category)}</span><h3 style="margin-top:12px">${esc(c.title)}</h3><p>${esc(c.description)}</p><p class="muted">${c.duration} h · ${c.lessons.length} leçon(s)</p><div class="progress"><i style="width:${p.passed?100:0}%"></i></div><p class="muted">${p.passed?'Quiz validé':'À commencer'}</p><button data-course="${c.id}">Ouvrir le parcours</button></div>`}).join('')}</div><div id="courseDetail"></div>`;v.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>openCourse(b.dataset.course));return}
if(current==='data'){v.innerHTML=head('Sauvegarde et importation','Conservez une copie de vos données locales avant toute manipulation.')+`<div class="two"><div class="card"><h3>Sauvegarde intégrale</h3><p>Export JSON de vos candidats, offres, candidatures et progression pédagogique.</p><button id="backup">Télécharger JSON</button><hr><label>Restaurer une sauvegarde JSON<input type="file" id="restore" accept=".json,application/json"></label><p class="muted">La restauration remplace toutes les données locales après confirmation.</p></div><div class="card"><h3>Importer des candidats CSV</h3><p>Colonnes acceptées : <code>name,email,phone,city,domain,years,skills,notes</code>.</p><label>Fichier CSV UTF-8<input type="file" id="csv" accept=".csv,text/csv"></label><p class="muted">Doublons détectés par adresse e-mail identique ou nom + téléphone identiques. Les doublons sont ignorés.</p><button id="template" class="ghost">Télécharger modèle CSV</button></div></div><div class="card"><h3>Maintenance</h3><p>Profils : ${db.candidates.length} · Offres : ${db.jobs.length} · Candidatures : ${db.applications.length}</p><button id="reset" class="danger">Réinitialiser les données locales</button></div><div id="importReport"></div>`;$('#backup').onclick=()=>dl('cabinet-rh-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json');$('#template').onclick=()=>dl('modele-candidats.csv','name,email,phone,city,domain,years,skills,notes\n','text/csv;charset=utf-8');$('#restore').onchange=restore;$('#csv').onchange=importCSV;$('#reset').onclick=()=>{if(confirm('Effacer toutes les données locales ? Cette action est irréversible sans sauvegarde.')&&confirm('Confirmez la suppression définitive des données de ce navigateur.')){db=initial();save();render()}};return}}
function rows(){let q=norm($('#cq')?.value),d=$('#cd')?.value;let arr=db.candidates.filter(c=>(!d||c.domain===d)&&(!q||norm([c.name,c.email,c.city,c.domain,c.skills].join(' ')).includes(q)));$('#candidateRows').innerHTML=arr.map(c=>`<tr><td><b>${esc(c.name)}</b><br><span class="muted">${esc(c.email)}</span></td><td>${esc(c.domain)}</td><td>${esc(c.city)}</td><td>${esc(c.skills)}</td><td>${esc(c.years)}</td><td><button class="small danger" data-delcandidate="${c.id}">Supprimer</button></td></tr>`).join('')||'<tr><td colspan="6">Aucun candidat correspondant.</td></tr>';document.querySelectorAll('[data-delcandidate]').forEach(b=>b.onclick=()=>{if(!confirm('Supprimer ce candidat et ses candidatures ?'))return;db.candidates=db.candidates.filter(c=>c.id!==b.dataset.delcandidate);db.applications=db.applications.filter(a=>a.candidateId!==b.dataset.delcandidate);save();render()})}
function matchRows(){let j=db.jobs.find(x=>x.id===$('#matchJob').value),out=$('#matches');if(!j){out.innerHTML=empty('Sélectionnez une offre.');return}let expected=words(j.skills);let ranked=db.candidates.map(c=>{let w=words(c.skills),found=[...expected].filter(s=>w.has(s)),competence=expected.size?found.length/expected.size:0,exp=j.minYears?Math.min(1,Number(c.years||0)/j.minYears):1,domain=norm(c.domain)&&norm(c.domain)===norm(j.domain)?1:0;return {c,found,score:Math.round(competence*75+exp*20+domain*5)}}).sort((a,b)=>b.score-a.score);out.innerHTML=`<p class="muted">Pondération : compétences 75 %, expérience 20 %, domaine 5 %. Aucun seuil automatique d'exclusion.</p><div class="scroll"><table><thead><tr><th>Candidat</th><th>Score indicatif</th><th>Compétences correspondantes</th><th>Expérience</th><th>Action</th></tr></thead><tbody>${ranked.map(r=>`<tr><td>${esc(r.c.name)}</td><td><b>${r.score}%</b></td><td>${esc(r.found.join(', ')||'Aucune correspondance déclarée')}</td><td>${esc(r.c.years)} an(s)</td><td><button class="small" data-apply="${r.c.id}">Ajouter au suivi</button></td></tr>`).join('')||'<tr><td colspan="5">Aucun candidat enregistré.</td></tr>'}</tbody></table></div>`;out.querySelectorAll('[data-apply]').forEach(b=>b.onclick=()=>{if(db.applications.some(a=>a.candidateId===b.dataset.apply&&a.jobId===j.id)){msg('Déjà présent dans le suivi.');return}db.applications.push({id:uid(),candidateId:b.dataset.apply,jobId:j.id,status:'Nouveau',note:''});save();msg('Candidature ajoutée au suivi.')})}
function openCourse(id){let c=db.courses.find(x=>x.id===id);if(!c)return;let p=db.progress[id]||{};$('#courseDetail').innerHTML=`<div class="card"><h3>${esc(c.title)}</h3>${c.lessons.map((l,i)=>`<div class="course"><b>Leçon ${i+1} — ${esc(l.title)}</b><p>${esc(l.text)}</p></div>`).join('')}<h3>Quiz de validation</h3><p>${esc(c.quiz.q)}</p><form id="quizForm">${c.quiz.options.map((o,i)=>`<label style="display:block;margin:8px 0;font-weight:400"><input type="radio" name="answer" value="${i}" required> ${esc(o)}</label>`).join('')}<button>Valider ma réponse</button></form><p id="quizResult" role="status">${p.passed?'Quiz déjà validé.':''}</p></div>`;$('#quizForm').onsubmit=e=>{e.preventDefault();let a=Number(new FormData(e.target).get('answer'));if(a===c.quiz.answer){db.progress[id]={passed:true,date:new Date().toISOString()};save();$('#quizResult').textContent='Bonne réponse ! Quiz validé. Cette démonstration ne délivre pas de certification officielle.'}else $('#quizResult').textContent='Réponse incorrecte. Relisez la leçon puis réessayez.'}}
function csvCell(x){let s=String(x??'');return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}function exportCandidates(){let cols=['name','email','phone','city','domain','years','skills','notes'];dl('candidats-'+new Date().toISOString().slice(0,10)+'.csv','\ufeff'+cols.join(',')+'\r\n'+db.candidates.map(c=>cols.map(k=>csvCell(c[k])).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function parseCSV(s){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<s.length;i++){let ch=s[i];if(quoted){if(ch==='"'&&s[i+1]==='"'){cell+='"';i++}else if(ch==='"')quoted=false;else cell+=ch}else if(ch==='"')quoted=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&s[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=ch}if(quoted)throw Error('Guillemets CSV non fermés');row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows}
async function importCSV(e){let f=e.target.files[0];if(!f)return;if(f.size>5e6){msg('CSV trop volumineux (maximum 5 Mo).');return}try{let rows=parseCSV((await f.text()).replace(/^\ufeff/,'')),headers=rows.shift().map(x=>norm(x));if(!headers.includes('name'))throw Error('Colonne name obligatoire');let added=0,duplicates=0,invalid=0;for(let row of rows){let c={};headers.forEach((h,i)=>c[h]=(row[i]||'').trim());if(!c.name){invalid++;continue}let email=norm(c.email),name=norm(c.name),phone=(c.phone||'').replace(/\D/g,'');if(db.candidates.some(x=>(email&&norm(x.email)===email)||(phone&&norm(x.name)===name&&(x.phone||'').replace(/\D/g,'')===phone))){duplicates++;continue}db.candidates.push({id:uid(),name:c.name,email:c.email||'',phone:c.phone||'',city:c.city||'',domain:c.domain||'',years:Math.max(0,Number(c.years)||0),skills:c.skills||'',notes:c.notes||'',created:new Date().toISOString()});added++}save();$('#importReport').innerHTML=`<div class="ok">Import terminé : ${added} ajouté(s), ${duplicates} doublon(s) ignoré(s), ${invalid} ligne(s) incomplète(s).</div>`}catch(err){msg('Import impossible : '+err.message)}e.target.value=''}
async function restore(e){let f=e.target.files[0];if(!f)return;try{if(f.size>10e6)throw Error('Fichier trop volumineux');let d=JSON.parse(await f.text());if(!Array.isArray(d.candidates)||!Array.isArray(d.jobs)||!Array.isArray(d.applications)||!Array.isArray(d.courses)||typeof d.progress!=='object'||d.progress===null)throw Error('Format de sauvegarde non reconnu');if(!confirm('Remplacer toutes les données locales par cette sauvegarde ?'))return;db=d;save();render();msg('Sauvegarde restaurée.')}catch(err){msg('Restauration impossible : '+err.message)}}
go('dashboard');
</script></body></html>
